<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Ellablings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #fafafa;
      color: #333;
    }
    h1 {
      color: #4B3621;
    }
    .cart-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 2px 2px 10px gray;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    img {
      width: 60px;
      border-radius: 5px;
    }
    .total {
      font-weight: bold;
      font-size: 18px;
      text-align: right;
      margin-top: 20px;
    }
    button {
      background-color: #4B3621;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6b4f32;
    }
  </style>
</head>
<body>
  <h1>Your Cart</h1>

  <div class="cart-container">
    <table id="cartTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="total" id="totalAmount">Total: $0</div>

    <h2>Customer Information</h2>
<form id="checkoutForm" style="margin-bottom:20px;">
  <label>Full Name:</label><br>
  <input type="text" id="fullName" required><br><br>

  <label>Email Address:</label><br>
  <input type="email" id="email" required><br><br>

  <label>Phone Number:</label><br>
  <input type="tel" id="phone" required><br><br>

  <label>Delivery Address:</label><br>
  <textarea id="address" rows="3" required></textarea><br><br>

  <button type="submit" id="checkoutBtn">Proceed to Payment</button>
</form>

  </div>

 <script src="https://js.paystack.co/v1/inline.js"></script>
<script src="cart.js"></script>
</body>
</html>
